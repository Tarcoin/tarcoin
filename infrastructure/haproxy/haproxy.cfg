# =============================================================================
# HAProxy — TARCOIN ElectrumX TCP Load Balancer
# =============================================================================
# Distributes Electrum client connections across multiple ElectrumX servers.
# Handles: TCP (50001), SSL (50002), WebSocket TLS (50004)
#
# Install: sudo apt install haproxy
# Config:  /etc/haproxy/haproxy.cfg
# Reload:  sudo systemctl reload haproxy
# =============================================================================

global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 50000
    user  haproxy
    group haproxy
    daemon

    # TLS settings
    ssl-default-bind-ciphers ECDH+AESGCM:DH+AESGCM:ECDH+AES256:DH+AES256:!aNULL:!MD5:!DSS
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect  5s
    timeout client   600s    # Long timeout — Electrum protocol uses long-lived connections
    timeout server   600s
    retries 3

# ---------------------------------------------------------------------------
# Stats page (internal monitoring)
# ---------------------------------------------------------------------------
listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:CHANGE_THIS_STATS_PASSWORD

# ---------------------------------------------------------------------------
# ElectrumX TCP (plaintext) — port 50001
# Internal connections only — clients behind VPN or LAN
# ---------------------------------------------------------------------------
frontend electrumx_tcp_front
    bind *:50001
    default_backend electrumx_tcp_back

backend electrumx_tcp_back
    balance leastconn          # Route to server with fewest active connections
    option tcp-check
    tcp-check connect port 50001

    # Add ElectrumX servers here
    server electrumx1 127.0.0.1:50001 check inter 30s rise 2 fall 3
    # server electrumx2 <IP2>:50001    check inter 30s rise 2 fall 3
    # server electrumx3 <IP3>:50001    check inter 30s rise 2 fall 3

# ---------------------------------------------------------------------------
# ElectrumX SSL — port 50002
# Public-facing — Electrum clients connect here
# ---------------------------------------------------------------------------
frontend electrumx_ssl_front
    bind *:50002
    default_backend electrumx_ssl_back

backend electrumx_ssl_back
    balance leastconn
    option tcp-check
    tcp-check connect port 50002

    server electrumx1 127.0.0.1:50002 check inter 30s rise 2 fall 3
    # server electrumx2 <IP2>:50002    check inter 30s rise 2 fall 3
    # server electrumx3 <IP3>:50002    check inter 30s rise 2 fall 3

# ---------------------------------------------------------------------------
# ElectrumX WebSocket TLS — port 50004
# For web wallet and browser clients
# ---------------------------------------------------------------------------
frontend electrumx_wss_front
    bind *:50004
    default_backend electrumx_wss_back

backend electrumx_wss_back
    balance leastconn
    option tcp-check
    tcp-check connect port 50004

    server electrumx1 127.0.0.1:50004 check inter 30s rise 2 fall 3
    # server electrumx2 <IP2>:50004    check inter 30s rise 2 fall 3
