<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tarcoin Web3 Identity</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090a0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }
    .card {
      background: #11131a;
      border: 1px solid rgba(245, 158, 11, 0.3);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      border-radius: 20px;
      padding: 36px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .domain-name {
      font-size: 26px;
      font-weight: 800;
      color: #f59e0b;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #34d399;
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .addr-box {
      background: #06070a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 24px;
      text-align: left;
    }
    .addr-label { font-size: 11px; color: #71717a; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .addr-val { font-family: monospace; font-size: 12px; color: #e4e4e7; word-break: break-all; }
    .btn-primary {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      font-weight: 700;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 10px;
      border: none;
      cursor: pointer;
    }
    .btn-secondary {
      display: block;
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #fff;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">👛</div>
    <div class="domain-name" id="domain-name">...</div>
    <div class="badge">Verified On-Chain Wallet ✅</div>

    <div class="addr-box">
      <div class="addr-label">Linked Tarcoin Address</div>
      <div class="addr-val" id="addr-val">...</div>
    </div>

    <a id="send-link" href="#" target="_blank" class="btn-primary">
      Send TAR in My-Wallet →
    </a>
    <button id="copy-btn" class="btn-secondary">
      Copy Address
    </button>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const name = params.get('name') || 'domain.tar';
    const addr = params.get('addr') || '';

    document.getElementById('domain-name').textContent = name;
    document.getElementById('addr-val').textContent = addr;
    document.getElementById('send-link').href = `https://my-wallet.tarcoin.org?sendTo=${encodeURIComponent(name)}`;

    document.getElementById('copy-btn').addEventListener('click', () => {
      navigator.clipboard.writeText(addr);
      document.getElementById('copy-btn').textContent = 'Copied to Clipboard ✓';
      setTimeout(() => { document.getElementById('copy-btn').textContent = 'Copy Address'; }, 2000);
    });
  </script>
</body>
</html>
