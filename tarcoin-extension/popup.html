<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tarcoin Name Service</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0b0d;
      color: #ffffff;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .header img { width: 32px; height: 32px; }
    .header-title { font-size: 14px; font-weight: 700; color: #f59e0b; }
    .header-sub { font-size: 11px; color: #71717a; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      margin-left: auto;
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; }
    .search-box {
      display: flex;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .search-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: white;
      padding: 10px 12px;
      font-size: 13px;
      outline: none;
      font-family: monospace;
    }
    .search-box button {
      background: #f59e0b;
      color: #000;
      border: none;
      padding: 0 14px;
      font-weight: 700;
      cursor: pointer;
      font-size: 12px;
    }
    .search-box button:hover { background: #fbbf24; }
    .quick-links { display: flex; flex-direction: column; gap: 8px; }
    .btn-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 8px 12px;
      border-radius: 8px;
      color: #d4d4d8;
      text-decoration: none;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn-link:hover {
      background: rgba(245, 158, 11, 0.1);
      border-color: rgba(245, 158, 11, 0.3);
      color: #f59e0b;
    }
    .footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 10px;
      color: #52525b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="TARCOIN">
    <div>
      <div class="header-title">Tarcoin Name Service</div>
      <div class="header-sub">Native Web3 Resolver</div>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span> Active
    </div>
  </div>

  <form id="search-form" class="search-box">
    <input type="text" id="domain-input" placeholder="e.g. tarcoin.tar" required>
    <button type="submit">Go</button>
  </form>

  <div class="quick-links">
    <a href="https://tarcoin.org/domains" target="_blank" class="btn-link">
      <span>🌐 Register .tar Domain</span>
      <span>→</span>
    </a>
    <a href="https://my-wallet.tarcoin.org" target="_blank" class="btn-link">
      <span>👛 Launch Web Wallet</span>
      <span>→</span>
    </a>
    <a href="https://explorer.tarcoin.org" target="_blank" class="btn-link">
      <span>⛓️ Blockchain Explorer</span>
      <span>→</span>
    </a>
  </div>

  <div class="footer">
    Type any .tar name in your address bar to resolve natively.
  </div>

  <script src="popup.js"></script>
</body>
</html>
