<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Domain Available - TNS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #090a0f;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }
    .card {
      background: #11131a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      border-radius: 20px;
      padding: 36px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .domain-name {
      font-size: 26px;
      font-weight: 800;
      color: #34d399;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #fbbf24;
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .desc {
      font-size: 13px;
      color: #a1a1aa;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-primary {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      font-weight: 700;
      padding: 14px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 14px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✨</div>
    <div class="domain-name" id="domain-name">...</div>
    <div class="badge">Available for Registration</div>

    <p class="desc">
      This decentralized .tar Web3 domain is not claimed yet. 
      You can claim it now to own your Web3 identity, host an IPFS website, or link it to your wallet.
    </p>

    <a id="claim-link" href="#" target="_blank" class="btn-primary">
      Claim this .tar Name Now →
    </a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const name = params.get('name') || 'domain.tar';
    document.getElementById('domain-name').textContent = name;
    document.getElementById('claim-link').href = `https://tarcoin.org/domains?search=${encodeURIComponent(name.replace('.tar',''))}`;
  </script>
</body>
</html>
