<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TARCOIN Miner Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'tarcoin-gold': '#FFD700',
                        'tarcoin-cyan': '#00FFFF',
                        'tarcoin-black': '#0a0a0a',
                        'tarcoin-green': '#00FF88',
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        space: ['Space Grotesk', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #fff; font-family: 'Space Grotesk', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.1);
            border-radius: 12px;
        }
        .text-glow { text-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
    </style>
</head>
<body class="min-h-screen bg-[url('https://www.transparenttextures.com/patterns/stardust.png')]">
    <nav class="border-b border-white/10 bg-black/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="https://tarcoin.org/tarcoin-logo.png" alt="Tarcoin" class="w-8 h-8 rounded-full shadow-lg">
                <span class="font-orbitron font-bold text-xl tracking-wider text-white">TARCOIN <span class="text-tarcoin-cyan text-sm">MINER</span></span>
            </div>
            <div>
                <a href="/" class="text-sm font-orbitron text-gray-400 hover:text-white transition-colors border border-white/20 px-4 py-2 rounded">← Back to Pool</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-orbitron font-black text-white mb-4 text-glow">MINER STATS</h1>
            <p class="text-tarcoin-cyan font-mono text-sm md:text-base break-all px-4" id="walletAddress">Loading...</p>
        </div>

        <h2 class="text-xl font-orbitron font-bold text-white mb-4 border-b border-white/10 pb-2">Worker Performance</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
            <div class="glass p-6 text-center">
                <div class="text-xs font-orbitron text-gray-400 tracking-widest mb-2 uppercase">Status</div>
                <div class="text-2xl font-orbitron font-bold text-green-500" id="minerStatus">ONLINE</div>
            </div>
            <div class="glass p-6 text-center">
                <div class="text-xs font-orbitron text-gray-400 tracking-widest mb-2 uppercase">Hashrate</div>
                <div class="text-2xl font-orbitron font-bold text-tarcoin-cyan" id="minerHashrate">0 GH/s</div>
            </div>
            <div class="glass p-6 text-center">
                <div class="text-xs font-orbitron text-gray-400 tracking-widest mb-2 uppercase">Valid Shares</div>
                <div class="text-2xl font-orbitron font-bold text-tarcoin-gold" id="minerShares">0</div>
            </div>
            <div class="glass p-6 text-center">
                <div class="text-xs font-orbitron text-gray-400 tracking-widest mb-2 uppercase">Last Share</div>
                <div class="text-2xl font-orbitron font-bold text-white" id="minerLastSeen">-</div>
            </div>
        </div>

        <h2 class="text-xl font-orbitron font-bold text-white mb-4 border-b border-white/10 pb-2">Pool Info</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
            <div class="glass p-6 text-center">
                <div class="text-xs font-orbitron text-gray-400 tracking-widest mb-2 uppercase">Pool Hashrate</div>
                <div class="text-2xl font-orbitron font-bold text-white" id="poolHash">0 TH/s</div>
            </div>
            <div class="glass p-6 text-center">
                <div class="text-xs font-orbitron text-gray-400 tracking-widest mb-2 uppercase">Active Miners</div>
                <div class="text-2xl font-orbitron font-bold text-white" id="poolMiners">0</div>
            </div>
            <div class="glass p-6 text-center">
                <div class="text-xs font-orbitron text-gray-400 tracking-widest mb-2 uppercase">Block Reward</div>
                <div class="text-2xl font-orbitron font-bold text-tarcoin-gold">49,500 TAR</div>
            </div>
        </div>

    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const targetAddress = urlParams.get('address');
        
        if (targetAddress) {
            document.getElementById('walletAddress').innerText = targetAddress;
        } else {
            document.getElementById('walletAddress').innerText = "No address specified.";
        }

        async function fetchMinerStats() {
            if (!targetAddress) return;
            try {
                const [poolRes, soloRes] = await Promise.all([
                    fetch('/api/pool/stats'),
                    fetch('/api/solo/stats')
                ]);
                const poolData = await poolRes.json();
                const soloData = await soloRes.json();
                
                // Check both pools
                let minerInfo = poolData.workers[targetAddress] || soloData.workers[targetAddress];
                let isSolo = !!soloData.workers[targetAddress];
                
                if (minerInfo) {
                    document.getElementById('minerStatus').innerText = 'ONLINE';
                    document.getElementById('minerStatus').className = 'text-2xl font-orbitron font-bold text-green-500';
                    document.getElementById('minerShares').innerText = minerInfo.shares.toLocaleString();
                    
                    // Simple Hashrate calc (Difficulty * 2^32 / Time)
                    // We'll estimate based on Vardiff if available, else standard
                    let diff = minerInfo.difficulty || poolData.difficulty || 1;
                    let hashrateRaw = (diff * 4294967296) / 60; // Hashes per second for that diff
                    let hashrateStr = hashrateRaw > 1e12 ? (hashrateRaw / 1e12).toFixed(2) + ' TH/s' : (hashrateRaw / 1e9).toFixed(2) + ' GH/s';
                    document.getElementById('minerHashrate').innerText = hashrateStr;

                    const timeAgo = Math.floor((Date.now() - minerInfo.lastSeen) / 1000);
                    const timeStr = timeAgo < 0 ? 'just now' : (timeAgo < 60 ? timeAgo + 's ago' : Math.floor(timeAgo / 60) + 'm ago');
                    document.getElementById('minerLastSeen').innerText = timeStr;
                    
                } else {
                    document.getElementById('minerStatus').innerText = 'OFFLINE';
                    document.getElementById('minerStatus').className = 'text-2xl font-orbitron font-bold text-gray-500';
                    document.getElementById('minerHashrate').innerText = '0 GH/s';
                    document.getElementById('minerShares').innerText = '0';
                    document.getElementById('minerLastSeen').innerText = 'Unknown';
                }
                // Pool stats
                let totalPoolHash = poolData.poolHashrate || 0;
                let totalSoloHash = soloData.soloHashrate || 0;
                let activeHash = isSolo ? totalSoloHash : totalPoolHash;
                
                let phStr = activeHash > 1e12 ? (activeHash / 1e12).toFixed(2) + ' TH/s' : (activeHash / 1e9).toFixed(2) + ' GH/s';
                document.getElementById('poolHash').innerText = phStr;
                
                let activeMiners = isSolo ? soloData.activeMiners : poolData.activeMiners;
                document.getElementById('poolMiners').innerText = activeMiners || 0;
                
            } catch (e) {
                console.error(e);
            }
        }

        fetchMinerStats();
        setInterval(fetchMinerStats, 10000); // Update every 10s
    </script>
</body>
</html>
