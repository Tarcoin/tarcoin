# TARCOIN Release Builder
# Builds all wallet/node packages and publishes to GitHub Releases
#
# Packages produced:
#   tarcoin-linux-full-v*.*.*.zip   — Ubuntu/Debian: tarcoind + tarcoin-cli + tarcoin-qt
#   tarcoin-linux-server-v*.*.*.zip — Ubuntu/Debian: tarcoind + tarcoin-cli (headless)
#   tarcoin-windows-cli-v*.*.*.zip  — Windows 10/11 64-bit: tarcoind.exe + tarcoin-cli.exe
#   tarcoin-macos-app.zip           — macOS 12+ Intel & Apple Silicon: full app bundle
#
# Triggers:
#   - Push of a v*.*.* tag  →  full build + GitHub Release
#   - workflow_dispatch      →  full build (no release unless tag is set)

name: Build & Release TARCOIN Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release from this build?'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

# ─── Shared constants ───────────────────────────────────────────────────────
env:
  CORE_DIR: blockchain_core/tarcoin-core
  GENESIS: 0000e37ee7aa8a88d1254ee3fe7c497c8fdaff36b29747eb64d8da68fbd9939e

# ────────────────────────────────────────────────────────────────────────────
# JOB 1 — Linux Full Package (Qt GUI + daemon + CLI)
# Runner: ubuntu-22.04 (Qt 6 available)
# ────────────────────────────────────────────────────────────────────────────
jobs:
  linux-full:
    name: Linux Full Package (Qt GUI)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake ninja-build \
            libevent-dev libboost-dev libboost-filesystem-dev \
            libboost-thread-dev libboost-program-options-dev \
            libsqlite3-dev libminiupnpc-dev libzmq3-dev \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools \
            libqt6svg6-dev libqrencode-dev libxkbcommon-dev \
            libgl1-mesa-dev zip

      - name: Configure (with Qt GUI)
        working-directory: ${{ env.CORE_DIR }}
        run: |
          touch contrib/filter-lcov.py || true
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=ON \
            -DENABLE_IPC=OFF \
            -DBUILD_TESTS=OFF \
            -DWITH_ZMQ=ON \
            -DWITH_UPNP=ON

      - name: Compile
        working-directory: ${{ env.CORE_DIR }}
        run: cmake --build build -j$(nproc)

      - name: Package — Linux Full
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          PKG="tarcoin-linux-full-${VERSION}"
          mkdir -p "${PKG}"
          cp "${{ env.CORE_DIR }}/build/bin/tarcoind"    "${PKG}/"
          cp "${{ env.CORE_DIR }}/build/bin/tarcoin-cli" "${PKG}/"
          cp "${{ env.CORE_DIR }}/build/bin/tarcoin-qt"  "${PKG}/"
          cat > "${PKG}/README.txt" << 'EOF'
          TARCOIN Linux Full Package
          ==========================
          Binaries: tarcoind | tarcoin-cli | tarcoin-qt
          Requires: Ubuntu / Debian 22.04+
          P2P Port: 19333  |  RPC Port: 19332
          Address:  tar1q... (SegWit) | T... (Legacy)
          Coin type: 5050 (SLIP-0044)
          EOF
          zip -r "${PKG}.zip" "${PKG}/"
          echo "PKG_LINUX_FULL=${PKG}.zip" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-full
          path: tarcoin-linux-full-*.zip
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Linux Server Node (headless daemon only, no Qt)
  # ────────────────────────────────────────────────────────────────────────────
  linux-server:
    name: Linux Server Node (headless)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake ninja-build \
            libevent-dev libboost-dev libboost-filesystem-dev \
            libboost-thread-dev libboost-program-options-dev \
            libsqlite3-dev libminiupnpc-dev libzmq3-dev zip

      - name: Configure (no Qt GUI)
        working-directory: ${{ env.CORE_DIR }}
        run: |
          touch contrib/filter-lcov.py || true
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF \
            -DENABLE_IPC=OFF \
            -DBUILD_TESTS=OFF \
            -DWITH_ZMQ=ON \
            -DWITH_UPNP=ON

      - name: Compile
        working-directory: ${{ env.CORE_DIR }}
        run: cmake --build build -j$(nproc)

      - name: Package — Linux Server
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          PKG="tarcoin-linux-server-${VERSION}"
          mkdir -p "${PKG}"
          cp "${{ env.CORE_DIR }}/build/bin/tarcoind"    "${PKG}/"
          cp "${{ env.CORE_DIR }}/build/bin/tarcoin-cli" "${PKG}/"
          cat > "${PKG}/README.txt" << 'EOF'
          TARCOIN Linux Server Node
          =========================
          Binaries: tarcoind | tarcoin-cli  (no GUI)
          Requires: Ubuntu / Debian 22.04+
          P2P Port: 19333  |  RPC Port: 19332
          Usage: ./tarcoind -daemon -rpcuser=<user> -rpcpassword=<pass>
          EOF
          zip -r "${PKG}.zip" "${PKG}/"
          echo "PKG_LINUX_SERVER=${PKG}.zip" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-server
          path: tarcoin-linux-server-*.zip
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Windows Wallet (MSYS2/UCRT64 native build with pre-built Qt6)
  # Runner: windows-2022 — avoids MinGW cross-compile GCC ICE with Qt6
  # Produces: tarcoind.exe + tarcoin-cli.exe + tarcoin-qt.exe
  # ────────────────────────────────────────────────────────────────────────────
  windows-wallet:
    name: Windows Wallet (Qt GUI + CLI)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 with UCRT64 + Qt6
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >
            gcc:u
            cmake:u
            ninja:u
            qt6-base:u
            qt6-tools:u
            qt6-svg:u
            boost:u
            libevent:u
            sqlite3:u
            miniupnpc:u
            zeromq:u
            qrencode:u

      - name: Configure CMake (MSYS2 native MinGW)
        working-directory: ${{ env.CORE_DIR }}
        run: |
          touch contrib/filter-lcov.py || true
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=ON \
            -DENABLE_IPC=OFF \
            -DBUILD_TESTS=OFF \
            -DWITH_ZMQ=ON \
            -DWITH_UPNP=ON

      - name: Compile
        working-directory: ${{ env.CORE_DIR }}
        run: cmake --build build -j$(nproc)

      - name: Deploy Qt DLLs (windeployqt)
        working-directory: ${{ env.CORE_DIR }}
        run: |
          # Bundle required Qt DLLs alongside tarcoin-qt.exe
          if [ -f build/bin/tarcoin-qt.exe ]; then
            windeployqt6 build/bin/tarcoin-qt.exe || \
            windeployqt build/bin/tarcoin-qt.exe || true
          fi

      - name: Package — Windows Wallet
        shell: pwsh
        run: |
          $VERSION = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $PKG = "tarcoin-windows-wallet-$VERSION"
          New-Item -ItemType Directory -Force -Path $PKG | Out-Null

          $CORE = "${{ env.CORE_DIR }}"
          $searchDirs = @("$CORE\build\bin", "$CORE\build\src", "$CORE\build\src\qt")

          foreach ($dir in $searchDirs) {
            foreach ($exe in @("tarcoind.exe", "tarcoin-cli.exe", "tarcoin-qt.exe")) {
              $src = Join-Path $dir $exe
              if (Test-Path $src) {
                Copy-Item $src "$PKG\" -Force
              }
            }
          }

          # Copy any Qt DLLs deployed alongside tarcoin-qt.exe
          $binDir = "$CORE\build\bin"
          if (Test-Path $binDir) {
            Get-ChildItem "$binDir" -Filter "*.dll" -Recurse | Copy-Item -Destination "$PKG\" -Force
            Get-ChildItem "$binDir" -Directory | Where-Object { $_.Name -in @("platforms","styles","imageformats","iconengines") } |
              Copy-Item -Destination "$PKG\" -Recurse -Force
          }

          @"
          TARCOIN Windows Wallet
          ======================
          Binaries: tarcoin-qt.exe (GUI) | tarcoind.exe | tarcoin-cli.exe
          Requires: Windows 10 / 11  (64-bit)
          P2P Port: 19333  |  RPC Port: 19332
          SegWit Address : tar1q...  (Bech32, HRP: tar)
          Legacy Address : T...      (Base58, prefix 65)
          Coin Type      : 5050      (SLIP-0044)

          Quick start GUI:
            Double-click tarcoin-qt.exe

          Quick start daemon:
            tarcoind.exe -daemon -rpcuser=<user> -rpcpassword=<pass>
            tarcoin-cli.exe getblockchaininfo
          "@ | Set-Content "$PKG\README.txt"

          Compress-Archive -Path "$PKG" -DestinationPath "${PKG}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-wallet
          path: tarcoin-windows-wallet-*.zip
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4a — macOS Intel build (macos-13)
  # ────────────────────────────────────────────────────────────────────────────
  macos-intel:
    name: macOS Wallet — Intel (x86_64)
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja pkg-config autoconf automake libtool \
            boost libevent sqlite qt@6 miniupnpc zeromq qrencode
          brew link qt@6 --force || brew link qt --force || true

      - name: Configure (Intel x86_64)
        working-directory: ${{ env.CORE_DIR }}
        run: |
          touch contrib/filter-lcov.py || true
          Qt6_DIR=$(brew --prefix qt@6)/lib/cmake/Qt6
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=ON \
            -DENABLE_IPC=OFF \
            -DBUILD_TESTS=OFF \
            -DWITH_ZMQ=ON \
            -DWITH_UPNP=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DQt6_DIR=$Qt6_DIR

      - name: Compile
        working-directory: ${{ env.CORE_DIR }}
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Upload Intel binaries
        uses: actions/upload-artifact@v4
        with:
          name: macos-intel-bins
          path: |
            ${{ env.CORE_DIR }}/build/bin/tarcoin-qt
            ${{ env.CORE_DIR }}/build/bin/tarcoind
            ${{ env.CORE_DIR }}/build/bin/tarcoin-cli
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4b — macOS Apple Silicon build (macos-14)
  # ────────────────────────────────────────────────────────────────────────────
  macos-arm:
    name: macOS Wallet — Apple Silicon (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake ninja pkg-config autoconf automake libtool \
            boost libevent sqlite qt@6 miniupnpc zeromq qrencode
          brew link qt@6 --force || brew link qt --force || true

      - name: Configure (Apple Silicon arm64)
        working-directory: ${{ env.CORE_DIR }}
        run: |
          touch contrib/filter-lcov.py || true
          Qt6_DIR=$(brew --prefix qt@6)/lib/cmake/Qt6
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=ON \
            -DENABLE_IPC=OFF \
            -DBUILD_TESTS=OFF \
            -DWITH_ZMQ=ON \
            -DWITH_UPNP=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DQt6_DIR=$Qt6_DIR

      - name: Compile
        working-directory: ${{ env.CORE_DIR }}
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Upload ARM binaries
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm-bins
          path: |
            ${{ env.CORE_DIR }}/build/bin/tarcoin-qt
            ${{ env.CORE_DIR }}/build/bin/tarcoind
            ${{ env.CORE_DIR }}/build/bin/tarcoin-cli
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4c — Combine Intel + ARM into Universal binary zip
  # ────────────────────────────────────────────────────────────────────────────
  macos-wallet:
    name: macOS Wallet — Universal (Intel + Apple Silicon)
    runs-on: macos-14
    needs: [macos-intel, macos-arm]
    steps:
      - name: Download Intel binaries
        uses: actions/download-artifact@v4
        with:
          name: macos-intel-bins
          path: bins/intel

      - name: Download ARM binaries
        uses: actions/download-artifact@v4
        with:
          name: macos-arm-bins
          path: bins/arm

      - name: Create Universal binaries with lipo
        run: |
          mkdir -p universal
          for bin in tarcoin-qt tarcoind tarcoin-cli; do
            chmod +x bins/intel/$bin bins/arm/$bin 2>/dev/null || true
            lipo -create bins/intel/$bin bins/arm/$bin -output universal/$bin
            echo "✓ $bin: $(lipo -archs universal/$bin)"
          done

      - name: Package — macOS Universal zip
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          PKG="tarcoin-macos-${VERSION}"
          mkdir -p "${PKG}"
          cp universal/tarcoin-qt  "${PKG}/"
          cp universal/tarcoind    "${PKG}/"
          cp universal/tarcoin-cli "${PKG}/"
          chmod +x "${PKG}/"*
          cat > "${PKG}/README.txt" << 'EOF'
          TARCOIN macOS Wallet
          ====================
          Universal Binary: Intel (x86_64) + Apple Silicon (arm64)
          Requires: macOS 12+ (Monterey or later)
          Binaries: tarcoin-qt | tarcoind | tarcoin-cli
          P2P Port: 19333  |  RPC Port: 19332
          SegWit Address : tar1q...  (Bech32, HRP: tar)
          Legacy Address : T...      (Base58, prefix 65)
          Coin Type      : 5050      (SLIP-0044)

          Usage:
            Open tarcoin-qt for the GUI wallet
            ./tarcoind -daemon -rpcuser=<user> -rpcpassword=<pass>
            ./tarcoin-cli getblockchaininfo
          EOF
          zip -r "tarcoin-macos-app.zip" "${PKG}/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-wallet
          path: tarcoin-macos-app.zip
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 5 — Create GitHub Release and attach all assets
  # Runs only when triggered by a tag push (v*.*.*)
  # ────────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [linux-full, linux-server, windows-wallet, macos-wallet]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Flatten artifacts into release dir
        run: |
          mkdir -p dist
          find release-assets/ -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          ls -lh dist/

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          sha256sum *.zip > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log ${PREV_TAG}..HEAD --oneline --no-merges | head -40)
          else
            CHANGES=$(git log --oneline --no-merges -20)
          fi
          echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "TARCOIN ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          body: |
            ## TARCOIN ${{ github.ref_name }}

            Official release of the TARCOIN node, wallet, and CLI tools.

            ---

            ### 📦 Downloads

            | Package | Platform | Contents |
            |---------|----------|----------|
            | `tarcoin-linux-full-${{ github.ref_name }}.zip` | Ubuntu/Debian 22.04+ | `tarcoind` + `tarcoin-cli` + `tarcoin-qt` (GUI) |
            | `tarcoin-linux-server-${{ github.ref_name }}.zip` | Ubuntu/Debian 22.04+ | `tarcoind` + `tarcoin-cli` (headless server) |
            | `tarcoin-windows-wallet-${{ github.ref_name }}.zip` | Windows 10/11 64-bit | `tarcoin-qt.exe` (GUI) + `tarcoind.exe` + `tarcoin-cli.exe` |
            | `tarcoin-macos-app.zip` | macOS 12+ (Intel & Apple Silicon) | `tarcoin-qt.app` + `tarcoind` + `tarcoin-cli` |

            Verify downloads with `SHA256SUMS.txt`.

            ---

            ### 🔗 Network Parameters

            | Parameter | Value |
            |-----------|-------|
            | Genesis Hash | `0000e37ee7aa8a88d1254ee3fe7c497c8fdaff36b29747eb64d8da68fbd9939e` |
            | Algorithm | SHA256d Proof-of-Work |
            | Block Reward | 50,000 TAR |
            | P2P Port | **19333** |
            | RPC Port | **19332** |
            | SegWit Address | `tar1q...` (Bech32, HRP: tar) |
            | Legacy Address | `T...` (Base58, prefix 65) |
            | Coin Type | **5050** (SLIP-0044) |
            | Max Supply | 50,000,000,000 TAR |

            ---

            ### 🚀 Quick Start (Linux Server)

            ```bash
            unzip tarcoin-linux-server-${{ github.ref_name }}.zip
            cd tarcoin-linux-server-${{ github.ref_name }}
            ./tarcoind -daemon -rpcuser=tarcoin -rpcpassword=<yourpassword>
            ./tarcoin-cli getblockchaininfo
            ```

            ### 🖥️ Quick Start (Windows CLI)

            ```powershell
            Expand-Archive tarcoin-windows-wallet-${{ github.ref_name }}.zip -DestinationPath .
            cd tarcoin-windows-wallet-${{ github.ref_name }}
            # GUI Wallet:
            .\tarcoin-qt.exe
            # Or daemon mode:
            .\tarcoind.exe -daemon -rpcuser=tarcoin -rpcpassword=<yourpassword>
            .\tarcoin-cli.exe getblockchaininfo
            ```

            ---

            ### 📝 Changes in this release
            ```
            ${{ steps.changelog.outputs.CHANGES }}
            ```

            ---

            🌐 [tarcoin.org](https://tarcoin.org) · 🔍 [explorer.tarcoin.org](https://explorer.tarcoin.org) · ⛏️ [pool.tarcoin.org](https://pool.tarcoin.org)
          token: ${{ secrets.GITHUB_TOKEN }}
