# TARCOIN Release Builder
# Builds all wallet/node packages and publishes to GitHub Releases
#
# Packages produced:
#   tarcoin-linux-full-v*.*.*.zip   — Ubuntu/Debian: tarcoind + tarcoin-cli + tarcoin-qt
#   tarcoin-linux-server-v*.*.*.zip — Ubuntu/Debian: tarcoind + tarcoin-cli (headless)
#   tarcoin-windows-cli-v*.*.*.zip  — Windows 10/11 64-bit: tarcoind.exe + tarcoin-cli.exe
#   tarcoin-macos-app.zip           — macOS 12+ Intel & Apple Silicon: full app bundle
#
# Triggers:
#   - Push of a v*.*.* tag  →  full build + GitHub Release
#   - workflow_dispatch      →  full build (no release unless tag is set)

name: Build & Release TARCOIN Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release from this build?'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

# ─── Shared constants ───────────────────────────────────────────────────────
env:
  CORE_DIR: blockchain_core/tarcoin-core
  GENESIS: 0000e37ee7aa8a88d1254ee3fe7c497c8fdaff36b29747eb64d8da68fbd9939e

# ────────────────────────────────────────────────────────────────────────────
# JOB 1 — Linux Full Package (Qt GUI + daemon + CLI)
# Runner: ubuntu-22.04 (Qt 6 available)
# ────────────────────────────────────────────────────────────────────────────
jobs:
  linux-full:
    name: Linux Full Package (Qt GUI)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake ninja-build \
            libevent-dev libboost-dev libboost-filesystem-dev \
            libboost-thread-dev libboost-program-options-dev \
            libsqlite3-dev libminiupnpc-dev libzmq3-dev \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            qt6-l10n-tools \
            libqt6svg6-dev libqrencode-dev libxkbcommon-dev \
            libgl1-mesa-dev zip

      - name: Configure (with Qt GUI)
        working-directory: ${{ env.CORE_DIR }}
        run: |
          touch contrib/filter-lcov.py || true
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=ON \
            -DENABLE_IPC=OFF \
            -DBUILD_TESTS=OFF \
            -DWITH_ZMQ=ON \
            -DWITH_UPNP=ON

      - name: Compile
        working-directory: ${{ env.CORE_DIR }}
        run: cmake --build build -j$(nproc)

      - name: Package — Linux Full
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          PKG="tarcoin-linux-full-${VERSION}"
          mkdir -p "${PKG}"
          cp "${{ env.CORE_DIR }}/build/bin/tarcoind"    "${PKG}/"
          cp "${{ env.CORE_DIR }}/build/bin/tarcoin-cli" "${PKG}/"
          cp "${{ env.CORE_DIR }}/build/bin/tarcoin-qt"  "${PKG}/"
          cat > "${PKG}/README.txt" << 'EOF'
          TARCOIN Linux Full Package
          ==========================
          Binaries: tarcoind | tarcoin-cli | tarcoin-qt
          Requires: Ubuntu / Debian 22.04+
          P2P Port: 19333  |  RPC Port: 19332
          Address:  tar1q... (SegWit) | T... (Legacy)
          Coin type: 5050 (SLIP-0044)
          EOF
          zip -r "${PKG}.zip" "${PKG}/"
          echo "PKG_LINUX_FULL=${PKG}.zip" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-full
          path: tarcoin-linux-full-*.zip
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Linux Server Node (headless daemon only, no Qt)
  # ────────────────────────────────────────────────────────────────────────────
  linux-server:
    name: Linux Server Node (headless)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake ninja-build \
            libevent-dev libboost-dev libboost-filesystem-dev \
            libboost-thread-dev libboost-program-options-dev \
            libsqlite3-dev libminiupnpc-dev libzmq3-dev zip

      - name: Configure (no Qt GUI)
        working-directory: ${{ env.CORE_DIR }}
        run: |
          touch contrib/filter-lcov.py || true
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF \
            -DENABLE_IPC=OFF \
            -DBUILD_TESTS=OFF \
            -DWITH_ZMQ=ON \
            -DWITH_UPNP=ON

      - name: Compile
        working-directory: ${{ env.CORE_DIR }}
        run: cmake --build build -j$(nproc)

      - name: Package — Linux Server
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          PKG="tarcoin-linux-server-${VERSION}"
          mkdir -p "${PKG}"
          cp "${{ env.CORE_DIR }}/build/bin/tarcoind"    "${PKG}/"
          cp "${{ env.CORE_DIR }}/build/bin/tarcoin-cli" "${PKG}/"
          cat > "${PKG}/README.txt" << 'EOF'
          TARCOIN Linux Server Node
          =========================
          Binaries: tarcoind | tarcoin-cli  (no GUI)
          Requires: Ubuntu / Debian 22.04+
          P2P Port: 19333  |  RPC Port: 19332
          Usage: ./tarcoind -daemon -rpcuser=<user> -rpcpassword=<pass>
          EOF
          zip -r "${PKG}.zip" "${PKG}/"
          echo "PKG_LINUX_SERVER=${PKG}.zip" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-server
          path: tarcoin-linux-server-*.zip
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Windows Wallet (MSYS2/UCRT64 native build with pre-built Qt6)
  # Runner: windows-2022 — avoids MinGW cross-compile GCC ICE with Qt6
  # Produces: tarcoind.exe + tarcoin-cli.exe + tarcoin-qt.exe
  # ────────────────────────────────────────────────────────────────────────────
  windows-wallet:
    name: Windows Wallet (Qt GUI + CLI)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 with UCRT64 + Qt6
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >
            gcc:u
            cmake:u
            ninja:u
            qt6-base:u
            qt6-tools:u
            qt6-svg:u
            boost:u
            libevent:u
            sqlite3:u
            miniupnpc:u
            zeromq:u
            qrencode:u

      - name: Configure CMake (MSYS2 native MinGW)
        working-directory: ${{ env.CORE_DIR }}
        run: |
          touch contrib/filter-lcov.py || true
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=ON \
            -DENABLE_IPC=OFF \
            -DBUILD_TESTS=OFF \
            -DWITH_ZMQ=ON \
            -DWITH_UPNP=ON

      - name: Compile
        working-directory: ${{ env.CORE_DIR }}
        run: cmake --build build -j$(nproc)

      - name: Bundle DLLs + Qt6 plugins (Python3 ldd collector)
        working-directory: ${{ env.CORE_DIR }}
        run: |
          python3 - << 'PYEOF'
          import subprocess, shutil, os, sys, glob
          from pathlib import Path

          BIN = Path("build/bin")
          UCRT64_BIN = Path("/ucrt64/bin")

          # Qt6 plugins can live in either location on MSYS2
          QT_PLUGIN_DIRS = [
              Path("/ucrt64/share/qt6/plugins"),
              Path("/ucrt64/lib/qt6/plugins"),
          ]

          def run_ldd(exe):
              try:
                  out = subprocess.check_output(
                      ["ldd", str(exe)], stderr=subprocess.DEVNULL, text=True, timeout=30)
                  return out
              except Exception:
                  return ""

          def collect(exe, dest):
              out = run_ldd(exe)
              for line in out.splitlines():
                  parts = line.strip().split()
                  dll_path = None
                  if "=>" in parts:
                      idx = parts.index("=>")
                      if idx + 1 < len(parts):
                          dll_path = Path(parts[idx + 1])
                  if dll_path is None or not dll_path.is_absolute():
                      continue
                  low = str(dll_path).lower()
                  if "/ucrt64" not in low and "/msys64" not in low:
                      continue
                  if not dll_path.exists():
                      continue
                  dst = dest / dll_path.name
                  if not dst.exists():
                      shutil.copy2(dll_path, dst)
                      print(f"  + {dll_path.name}")

          print("=== Collecting DLLs via ldd ===")
          for exe_name in ["tarcoin-qt.exe", "tarcoind.exe", "tarcoin-cli.exe"]:
              exe = BIN / exe_name
              if exe.exists():
                  print(f"Scanning {exe_name} ...")
                  collect(exe, BIN)

          print("\n=== Ensuring critical MSYS2 DLLs ===")
          critical_patterns = [
              "libqrencode*.dll",
              "libzmq*.dll",
              "libevent*.dll", "libevent_core*.dll", "libevent_extra*.dll",
              "libgcc_s*.dll", "libstdc++*.dll", "libwinpthread*.dll",
              "libsqlite3*.dll",
              "libssl*.dll", "libcrypto*.dll",
              "libbz2*.dll", "libzstd*.dll", "libpng*.dll",
              "libfreetype*.dll", "libharfbuzz*.dll", "libpcre2*.dll",
              "libb2*.dll", "libdouble-conversion*.dll",
              "libicudt*.dll", "libicuin*.dll", "libicuuc*.dll",
          ]
          for pattern in critical_patterns:
              for dll in glob.glob(str(UCRT64_BIN / pattern)):
                  dst = BIN / Path(dll).name
                  if not dst.exists():
                      shutil.copy2(dll, dst)
                      print(f"  critical: {Path(dll).name}")

          print("\n=== Copying Qt6 plugin directories ===")
          plugin_dirs = ["platforms", "styles", "imageformats", "iconengines"]
          for plugin_dir_name in plugin_dirs:
              src_dir = None
              for qt_root in QT_PLUGIN_DIRS:
                  candidate = qt_root / plugin_dir_name
                  if candidate.exists():
                      src_dir = candidate
                      break
              if src_dir:
                  dst_dir = BIN / plugin_dir_name
                  dst_dir.mkdir(exist_ok=True)
                  for dll in src_dir.glob("*.dll"):
                      shutil.copy2(dll, dst_dir / dll.name)
                      print(f"  {plugin_dir_name}/{dll.name}")
              else:
                  print(f"  WARNING: {plugin_dir_name} not found in Qt6 plugin dirs")

          total = len(list(BIN.glob("*.dll")))
          print(f"\n=== Done: {total} root DLLs, plugin dirs: {plugin_dirs} ===")
          sys.exit(0)
          PYEOF

      - name: Package — Windows Wallet
        shell: pwsh
        run: |
          $VERSION = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $PKG = "tarcoin-windows-wallet-$VERSION"
          New-Item -ItemType Directory -Force -Path $PKG | Out-Null

          $CORE = "${{ env.CORE_DIR }}"
          $searchDirs = @("$CORE\build\bin", "$CORE\build\src", "$CORE\build\src\qt")

          # Copy executables
          foreach ($dir in $searchDirs) {
            foreach ($exe in @("tarcoind.exe", "tarcoin-cli.exe", "tarcoin-qt.exe")) {
              $src = Join-Path $dir $exe
              if (Test-Path $src) {
                Copy-Item $src "$PKG\" -Force
              }
            }
          }

          # Copy ALL DLLs from build\bin (flat)
          $binDir = "$CORE\build\bin"
          if (Test-Path $binDir) {
            Get-ChildItem "$binDir" -Filter "*.dll" | Copy-Item -Destination "$PKG\" -Force
            # Copy ALL plugin subdirectories (platforms, styles, imageformats, iconengines, etc.)
            Get-ChildItem "$binDir" -Directory | ForEach-Object {
              Copy-Item $_.FullName -Destination "$PKG\" -Recurse -Force
            }
          }

          @"
          TARCOIN Windows Wallet
          ======================
          Binaries: tarcoin-qt.exe (GUI) | tarcoind.exe | tarcoin-cli.exe
          Requires: Windows 10 / 11  (64-bit)
          P2P Port: 19333  |  RPC Port: 19332
          SegWit Address : tar1q...  (Bech32, HRP: tar)
          Legacy Address : T...      (Base58, prefix 65)
          Coin Type      : 5050      (SLIP-0044)

          Quick start GUI:
            Double-click tarcoin-qt.exe

          Quick start daemon:
            tarcoind.exe -daemon -rpcuser=<user> -rpcpassword=<pass>
            tarcoin-cli.exe getblockchaininfo
          "@ | Set-Content "$PKG\README.txt"

          Compress-Archive -Path "$PKG" -DestinationPath "${PKG}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-wallet
          path: tarcoin-windows-wallet-*.zip
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4 — macOS Wallet (Universal: Intel x86_64 + Apple Silicon arm64)
  # Runner : macos-14 (Apple Silicon)
  # Output : tarcoin-macos-app.dmg  (via cmake deploy target / macdeployqtplus)
  #          tarcoin-macos-app.zip  (fallback if .dmg creation fails)
  # ────────────────────────────────────────────────────────────────────────────
  macos-wallet:
    name: macOS Wallet (Universal — Intel + Apple Silicon)
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install cmake ninja pkg-config autoconf automake libtool \
            boost libevent sqlite qt@6 zeromq qrencode create-dmg
          brew link qt@6 --force || brew link qt --force || true

      - name: Install Python helpers for DMG deploy script
        run: pip3 install ds_store mac_alias --break-system-packages || true

      - name: Configure CMake — Universal binary (x86_64 + arm64)
        working-directory: ${{ env.CORE_DIR }}
        run: |
          touch contrib/filter-lcov.py || true
          Qt6_DIR=$(brew --prefix qt@6)/lib/cmake/Qt6
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=ON \
            -DENABLE_IPC=OFF \
            -DBUILD_TESTS=OFF \
            -DWITH_ZMQ=ON \
            -DWITH_UPNP=OFF \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DQt6_DIR=$Qt6_DIR

      - name: Compile
        working-directory: ${{ env.CORE_DIR }}
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Verify universal binaries
        working-directory: ${{ env.CORE_DIR }}
        run: |
          for bin in tarcoin-qt tarcoind tarcoin-cli; do
            if [ -f "build/bin/$bin" ]; then
              echo "✓ $bin: $(lipo -archs build/bin/$bin)"
            fi
          done

      - name: Create .dmg (macdeployqtplus deploy target)
        working-directory: ${{ env.CORE_DIR }}
        run: |
          cmake --build build --target deploy 2>/dev/null || true
          # Show what was produced
          find build -name "*.dmg" -o -name "*.zip" 2>/dev/null | head -10

      - name: Package — collect .dmg or create .zip fallback
        working-directory: ${{ env.CORE_DIR }}
        run: |
          # Prefer the .dmg from deploy target
          DMG=$(find build -maxdepth 2 -name "*.dmg" | head -1)
          if [ -n "$DMG" ]; then
            echo "Found DMG: $DMG"
            cp "$DMG" build/tarcoin-macos-app.dmg
            # Also create a zip containing the dmg for the artifact uploader
            zip -j build/tarcoin-macos-app.zip build/tarcoin-macos-app.dmg
            echo "MACOS_ASSET=build/tarcoin-macos-app.dmg" >> $GITHUB_ENV
          else
            echo "No DMG found — creating zip fallback"
            VERSION="${GITHUB_REF_NAME:-dev}"
            PKG="tarcoin-macos-${VERSION}"
            mkdir -p "${PKG}"
            [ -f build/bin/tarcoin-qt  ] && cp build/bin/tarcoin-qt  "${PKG}/"
            [ -f build/bin/tarcoind    ] && cp build/bin/tarcoind    "${PKG}/"
            [ -f build/bin/tarcoin-cli ] && cp build/bin/tarcoin-cli "${PKG}/"
            chmod +x "${PKG}"/* 2>/dev/null || true
            cat > "${PKG}/README.txt" << 'EOF'
          TARCOIN macOS Wallet
          ====================
          Universal Binary: Intel (x86_64) + Apple Silicon (arm64)
          Requires: macOS 12+ (Monterey or later)
          Binaries: tarcoin-qt | tarcoind | tarcoin-cli
          P2P Port: 19333  |  RPC Port: 19332
          SegWit Address : tar1q...  (Bech32, HRP: tar)
          Legacy Address : T...      (Base58, prefix 65)
          Coin Type      : 5050      (SLIP-0044)
          EOF
            zip -r build/tarcoin-macos-app.zip "${PKG}/"
            echo "MACOS_ASSET=build/tarcoin-macos-app.zip" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-wallet
          path: |
            ${{ env.CORE_DIR }}/build/tarcoin-macos-app.dmg
            ${{ env.CORE_DIR }}/build/tarcoin-macos-app.zip
          if-no-files-found: warn
          retention-days: 7


  # ────────────────────────────────────────────────────────────────────────────
  # JOB 5 — Create GitHub Release and attach all assets
  # Runs only when triggered by a tag push (v*.*.*)
  # ────────────────────────────────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [linux-full, linux-server, windows-wallet, macos-wallet]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: Flatten artifacts into release dir
        run: |
          mkdir -p dist
          find release-assets/ -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} dist/ \;
          ls -lh dist/

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          sha256sum *.zip > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log ${PREV_TAG}..HEAD --oneline --no-merges | head -40)
          else
            CHANGES=$(git log --oneline --no-merges -20)
          fi
          echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "TARCOIN ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          body: |
            ## TARCOIN ${{ github.ref_name }}

            Official release of the TARCOIN node, wallet, and CLI tools.

            ---

            ### 📦 Downloads

            | Package | Platform | Contents |
            |---------|----------|----------|
            | `tarcoin-linux-full-${{ github.ref_name }}.zip` | Ubuntu/Debian 22.04+ | `tarcoind` + `tarcoin-cli` + `tarcoin-qt` (GUI) |
            | `tarcoin-linux-server-${{ github.ref_name }}.zip` | Ubuntu/Debian 22.04+ | `tarcoind` + `tarcoin-cli` (headless server) |
            | `tarcoin-windows-wallet-${{ github.ref_name }}.zip` | Windows 10/11 64-bit | `tarcoin-qt.exe` (GUI) + `tarcoind.exe` + `tarcoin-cli.exe` |
            | `tarcoin-macos-app.zip` | macOS 12+ (Intel & Apple Silicon) | `tarcoin-qt.app` + `tarcoind` + `tarcoin-cli` |

            Verify downloads with `SHA256SUMS.txt`.

            ---

            ### 🔗 Network Parameters

            | Parameter | Value |
            |-----------|-------|
            | Genesis Hash | `0000e37ee7aa8a88d1254ee3fe7c497c8fdaff36b29747eb64d8da68fbd9939e` |
            | Algorithm | SHA256d Proof-of-Work |
            | Block Reward | 50,000 TAR |
            | P2P Port | **19333** |
            | RPC Port | **19332** |
            | SegWit Address | `tar1q...` (Bech32, HRP: tar) |
            | Legacy Address | `T...` (Base58, prefix 65) |
            | Coin Type | **5050** (SLIP-0044) |
            | Max Supply | 50,000,000,000 TAR |

            ---

            ### 🚀 Quick Start (Linux Server)

            ```bash
            unzip tarcoin-linux-server-${{ github.ref_name }}.zip
            cd tarcoin-linux-server-${{ github.ref_name }}
            ./tarcoind -daemon -rpcuser=tarcoin -rpcpassword=<yourpassword>
            ./tarcoin-cli getblockchaininfo
            ```

            ### 🖥️ Quick Start (Windows CLI)

            ```powershell
            Expand-Archive tarcoin-windows-wallet-${{ github.ref_name }}.zip -DestinationPath .
            cd tarcoin-windows-wallet-${{ github.ref_name }}
            # GUI Wallet:
            .\tarcoin-qt.exe
            # Or daemon mode:
            .\tarcoind.exe -daemon -rpcuser=tarcoin -rpcpassword=<yourpassword>
            .\tarcoin-cli.exe getblockchaininfo
            ```

            ---

            ### 📝 Changes in this release
            ```
            ${{ steps.changelog.outputs.CHANGES }}
            ```

            ---

            🌐 [tarcoin.org](https://tarcoin.org) · 🔍 [explorer.tarcoin.org](https://explorer.tarcoin.org) · ⛏️ [pool.tarcoin.org](https://pool.tarcoin.org)
          token: ${{ secrets.GITHUB_TOKEN }}
