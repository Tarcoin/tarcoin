name: Build Native TARCOIN Mobile APK

on:
  push:
    branches:
      - master
    paths:
      - 'wallet/tarcoin-rn/**'
      - '.github/workflows/build-tarcoin-rn-apk.yml'
  workflow_dispatch:

jobs:
  build-rn-apk:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd wallet/tarcoin-rn
          npm install

      - name: Build Android APK
        run: |
          cd wallet/tarcoin-rn/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TARCOIN-Native-Android.apk
          path: wallet/tarcoin-rn/android/app/build/outputs/apk/debug/app-debug.apk
