name: Build macOS Wallet

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake pkg-config autoconf automake libtool
          brew install boost libevent sqlite python3
          brew install qt
          brew link qt --force
          pip3 install ds_store mac_alias --break-system-packages
          brew install miniupnpc zeromq qrencode

      - name: Configure CMake
        run: |
          cd blockchain_core/tarcoin-core
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
                -DWITH_ZMQ=ON -DWITH_UPNP=ON \
                -DBUILD_GUI=ON -DENABLE_IPC=OFF -DBUILD_TESTS=OFF 2> cmake_errors.txt || true
          cat cmake_errors.txt
          if [ -s cmake_errors.txt ] && grep -q "CMake Error" cmake_errors.txt; then exit 1; fi

      - name: Compile and Package DMG
        run: |
          cd blockchain_core/tarcoin-core
          cmake --build build -j$(sysctl -n hw.ncpu)
          cmake --build build --target deploy

      - name: Upload macOS Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarcoin-macos
          path: blockchain_core/tarcoin-core/build/tarcoin-macos-app.zip

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: blockchain_core/tarcoin-core/build/tarcoin-macos-app.zip
