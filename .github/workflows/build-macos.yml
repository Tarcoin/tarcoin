name: Build macOS Wallet

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew update
          brew install cmake pkg-config autoconf automake libtool
          brew install boost libevent sqlite
          brew install qt@5
          brew link qt@5 --force
          brew install miniupnpc zeromq

      - name: Configure CMake
        run: |
          cd blockchain_core/tarcoin-core
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
                -DWITH_ZMQ=ON -DWITH_UPNP=ON \
                -DBUILD_GUI=ON

      - name: Compile and Package DMG
        run: |
          cd blockchain_core/tarcoin-core
          cmake --build build -j$(sysctl -n hw.ncpu)
          cmake --build build --target deploy

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarcoin-macos
          path: blockchain_core/tarcoin-core/build/tarcoin-*.dmg

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: blockchain_core/tarcoin-core/build/tarcoin-*.dmg
