name: Build TARCOIN Mobile Wallet

on:
  push:
    branches:
      - master
    paths:
      - 'wallet/**'
      - '.github/workflows/build-wallet.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'wallet/**'
      - '.github/workflows/build-wallet.yml'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  # ---------------------------------------------------------------------------
  # Android Build Job
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'wallet/package.json'

      - name: Setup Android Wallet Environment
        run: |
          chmod +x wallet/scripts/*.sh
          ./wallet/scripts/setup.sh

      - name: Build Android Debug APK
        run: |
          cd wallet/TARWallet
          # Build using the Gradle wrapper inside the cloned repository
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarcoin-wallet-android-debug
          path: wallet/TARWallet/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # iOS Build Verification Job (Compiles for Simulator to verify build checks)
  # ---------------------------------------------------------------------------
  build-ios:
    name: Build iOS App (Simulator check)
    runs-on: macos-13
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'wallet/package.json'

      - name: Setup CocoaPods Cache
        uses: actions/cache@v4
        with:
          path: wallet/TARWallet/ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('wallet/TARWallet/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Setup iOS Wallet Environment
        run: |
          chmod +x wallet/scripts/*.sh
          ./wallet/scripts/setup.sh

      - name: Install Pods
        run: |
          cd wallet/TARWallet/ios
          pod install --repo-update

      - name: Build iOS Simulator App
        run: |
          cd wallet/TARWallet
          xcodebuild \
            -workspace ios/TARWallet.xcworkspace \
            -scheme TARWallet \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 14' \
            build \
            | xcpretty || true
