name: Build Applet Android APK

on:
  push:
    branches:
      - master
    paths:
      - 'wallet/applet/**'
      - '.github/workflows/build-applet-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK in Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Capacitor
        run: |
          cd wallet/applet
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init TARWallet com.tarcoin.wallet --web-dir dist
          npm run build
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin stdlib duplicate classes
        # kotlin-stdlib 1.8+ merged jdk7/jdk8 modules. Capacitor still pulls in
        # the old separate artifacts, causing duplicate class errors at Gradle build.
        # We patch the top-level build.gradle to exclude the old artifacts.
        run: |
          GRADLE_FILE="wallet/applet/android/build.gradle"
          cat >> "$GRADLE_FILE" << 'EOF'

          // Fix: exclude old kotlin-stdlib-jdk7/jdk8 which are now bundled in kotlin-stdlib 1.8+
          subprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

      - name: Build Android Debug APK
        run: |
          cd wallet/applet/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TARWallet-CakeStyle-Android.apk
          path: wallet/applet/android/app/build/outputs/apk/debug/app-debug.apk
