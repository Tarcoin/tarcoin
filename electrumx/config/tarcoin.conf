# tarcoin.conf — tarcoind configuration for ElectrumX backend
# Place at: /home/tarcoin/.tarcoin/tarcoin.conf
# Or mount via Docker volume as shown in docker-compose.yml

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
# Listen for RPC connections from any address within Docker network
rpcbind=0.0.0.0
rpcallowip=172.21.0.0/16
rpcallowip=127.0.0.1

# RPC port — from src/chainparamsbase.cpp CreateBaseChainParams MAIN = 19332
rpcport=19332

# P2P port — from src/kernel/chainparams.cpp nDefaultPort = 19333
port=19333

# ---------------------------------------------------------------------------
# CRITICAL for ElectrumX: Transaction index
# ElectrumX requires txindex=1 to look up arbitrary transactions by txid.
# If starting a new node, add this from the beginning.
# If adding to existing node, run: tarcoind -reindex (takes hours)
# ---------------------------------------------------------------------------
txindex=1

# ---------------------------------------------------------------------------
# Performance
# ---------------------------------------------------------------------------
# Database cache size in MB (increase on high-RAM servers)
dbcache=2048

# Maximum number of connections
maxconnections=32

# ---------------------------------------------------------------------------
# Optional: ZMQ notifications (for real-time updates)
# ElectrumX can use ZMQ for faster block/tx notification
# ---------------------------------------------------------------------------
# zmqpubrawblock=tcp://0.0.0.0:28332
# zmqpubrawtx=tcp://0.0.0.0:28333

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
# Log to file instead of stdout when not using -printtoconsole
# debug=net
# debug=mempool
