# =============================================================================
# ElectrumX — TARCOIN Testnet Configuration
# =============================================================================
# From src/kernel/chainparams.cpp CTestNetParams
# From src/chainparamsbase.cpp CreateBaseChainParams TESTNET
# =============================================================================

COIN = TarCoinTestnet
NETWORK = testnet

DB_DIRECTORY = /data/electrumx-testnet
DB_ENGINE = leveldb

# Testnet RPC port = 29332 (from chainparamsbase.cpp)
DAEMON_URL = http://tarcoin:CHANGE_THIS_PASSWORD@127.0.0.1:29332/

# Testnet uses different ElectrumX ports to avoid conflict with mainnet
SERVICES = tcp://:60001,ssl://:60002
REPORT_SERVICES = ssl://testnet-electrum.tarcoin.org:60002

SSL_CERTFILE = /etc/ssl/electrumx/server.crt
SSL_KEYFILE  = /etc/ssl/electrumx/server.key

HOST = testnet-electrum.tarcoin.org

CACHE_MB = 200
MAX_SESSIONS = 100
LOG_LEVEL = debug
PEER_DISCOVERY = self
PEER_ANNOUNCE = off
