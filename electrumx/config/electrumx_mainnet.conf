# =============================================================================
# ElectrumX — TARCOIN Mainnet Configuration
# =============================================================================
# Place this file at: /etc/electrumx/electrumx.conf
# Or reference with: ELECTRUMX_CONFIG=/path/to/electrumx.conf
#
# All network values verified from TARCOIN Core source:
#   src/kernel/chainparams.cpp
#   src/chainparamsbase.cpp
# =============================================================================

# ---------------------------------------------------------------------------
# Coin identity
# ---------------------------------------------------------------------------
COIN = TarCoin
NETWORK = mainnet

# ---------------------------------------------------------------------------
# Database
# ---------------------------------------------------------------------------
# Directory where ElectrumX stores its index database (LevelDB)
# Requires ~10-50 GB as chain grows. Use fast SSD storage.
DB_DIRECTORY = /data/electrumx
DB_ENGINE = leveldb

# ---------------------------------------------------------------------------
# Connection to tarcoind
# ---------------------------------------------------------------------------
# Format: http://rpcuser:rpcpassword@host:rpcport/
# RPC port 19332 from src/chainparamsbase.cpp CreateBaseChainParams MAIN
DAEMON_URL = http://tarcoin:CHANGE_THIS_PASSWORD@127.0.0.1:19332/

# ---------------------------------------------------------------------------
# ElectrumX services
# ---------------------------------------------------------------------------
# SERVICES defines what protocols and ports ElectrumX listens on.
# Format: protocol://host:port
#
# TCP  50001 — plaintext Electrum protocol (LAN / behind reverse proxy only)
# SSL  50002 — TLS Electrum protocol (public-facing)
# WSS  50004 — WebSocket TLS (for web wallets)
#
# Replace 0.0.0.0 with your server's public IP or domain for REPORT_SERVICES
SERVICES = tcp://:50001,ssl://:50002,wss://:50004

# What clients will see when they ask for your server address
# Replace with your actual domain or IP
REPORT_SERVICES = ssl://electrum.tarcoin.org:50002,tcp://electrum.tarcoin.org:50001

# ---------------------------------------------------------------------------
# TLS certificates (required for SSL/WSS services)
# ---------------------------------------------------------------------------
# Generate with Let's Encrypt: see scripts/setup_ssl.sh
SSL_CERTFILE = /etc/ssl/electrumx/server.crt
SSL_KEYFILE  = /etc/ssl/electrumx/server.key

# ---------------------------------------------------------------------------
# Server identity (shown to Electrum clients)
# ---------------------------------------------------------------------------
HOST = electrum.tarcoin.org

# ---------------------------------------------------------------------------
# Performance tuning
# ---------------------------------------------------------------------------
# Number of parallel RPC calls to tarcoind during initial sync
DAEMON_MAX_TASKS = 0

# Cache size in MB — increase on high-RAM servers
CACHE_MB = 1000

# Maximum number of simultaneous client connections
MAX_SESSIONS = 1000

# Maximum number of subscriptions per client
MAX_SEND = 10000000

# Ban clients that send more than this many requests per second
BANDWIDTH_LIMIT = 2000000
SESSION_TIMEOUT = 600

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
LOG_LEVEL = info

# ---------------------------------------------------------------------------
# Peer discovery
# ---------------------------------------------------------------------------
# Set to false initially — enable once multiple servers exist
PEER_DISCOVERY = self
PEER_ANNOUNCE = off
