# =============================================================================
# nginx — ElectrumX TARCOIN SSL/TLS Reverse Proxy
# =============================================================================
# Place at: /etc/nginx/conf.d/electrumx.conf
# Or mount via Docker volume as shown in docker-compose.yml
#
# Handles:
#   - TCP stream proxying for Electrum SSL protocol (port 50002)
#   - WebSocket TLS proxying (port 50004)
#   - HTTP → HTTPS redirect
# =============================================================================

# TCP stream proxy for Electrum SSL protocol
# Required because Electrum uses a custom line-based protocol, not HTTP
stream {

    # Upstream ElectrumX server (plaintext TCP, internal)
    upstream electrumx_tcp {
        server electrumx:50001;
    }

    # SSL termination for Electrum clients
    # Clients connect to port 50002 with TLS
    server {
        listen 50002 ssl;

        ssl_certificate     /etc/ssl/electrumx/server.crt;
        ssl_certificate_key /etc/ssl/electrumx/server.key;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        proxy_pass          electrumx_tcp;
        proxy_timeout       600s;
        proxy_connect_timeout 5s;
    }
}

# HTTP server block
http {

    # ---------------------------------------------------------------------------
    # Upstream definitions
    # ---------------------------------------------------------------------------
    upstream electrumx_ws {
        server electrumx:50004;
    }

    # ---------------------------------------------------------------------------
    # HTTP → HTTPS redirect
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name electrum.tarcoin.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------------------------------------------------------
    # HTTPS — WebSocket proxy for web wallet clients
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name electrum.tarcoin.org;

        ssl_certificate     /etc/ssl/electrumx/server.crt;
        ssl_certificate_key /etc/ssl/electrumx/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;

        # WebSocket proxy for ElectrumX WSS (port 50004)
        location / {
            proxy_pass         http://electrumx_ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
