# Tarcoin Core Node Configuration for Layer-2 (TLN) on D: Drive
server=1
listen=1
txindex=0
prune=0

# Network Ports
port=19333
rpcport=19332
rpcallowip=127.0.0.1
rpcbind=127.0.0.1

# RPC Authentication (for LND / Lightning)
rpcuser=tarcoinrpc
rpcpassword=tarcoinpassword

# ZeroMQ Notifications (Required by LND to detect blocks and transactions in real-time)
zmqpubrawblock=tcp://127.0.0.1:28332
zmqpubrawtx=tcp://127.0.0.1:28333
